<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisper Transcribe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" x2="12" y1="19" y2="22"/>
                    </svg>
                </div>
                <h1>Whisper Transcribe</h1>
            </div>
            <div class="header-right">
                <div class="gpu-widget" id="gpuWidget">
                    <div class="gpu-bar-wrapper">
                        <span class="gpu-label">VRAM</span>
                        <div class="gpu-bar-track">
                            <div class="gpu-bar-fill" id="gpuBarFill"></div>
                        </div>
                        <span class="gpu-value" id="gpuValue">—</span>
                    </div>
                    <div class="gpu-stats">
                        <span id="gpuUtil">GPU 0%</span>
                        <span id="gpuTemp">— °C</span>
                    </div>
                </div>
                <div class="status-badge" id="statusBadge">
                    <span class="status-dot"></span>
                    <span class="status-text">Conectando...</span>
                </div>
            </div>
        </header>

        <main class="main">
            <!-- Upload Area -->
            <section class="upload-section" id="uploadSection">
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" x2="12" y1="3" y2="15"/>
                        </svg>
                    </div>
                    <h2>Selecione ou arraste um vídeo</h2>
                    <p class="upload-hint">MP4, MKV, AVI, MOV, MP3, WAV, FLAC — até 2 GB</p>
                    <button class="btn btn-primary" id="selectFileBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                            <polyline points="13 2 13 9 20 9"/>
                        </svg>
                        Escolher arquivo
                    </button>
                    <input type="file" id="fileInput" accept=".mp4,.mkv,.avi,.mov,.webm,.flv,.wmv,.mp3,.wav,.flac,.ogg,.aac,.m4a,.opus" hidden>
                </div>

                <div class="options-row options-4col">
                    <div class="option-group">
                        <label for="modelSelect">Modelo</label>
                        <select id="modelSelect">
                            <option value="large-v3-turbo" selected>⚡ Rápido — large-v3-turbo</option>
                            <option value="large-v3">🎯 Preciso — large-v3</option>
                            <option value="medium">🏃 Leve — medium</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label for="languageSelect">Idioma</label>
                        <select id="languageSelect">
                            <option value="">Auto-detectar</option>
                            <option value="pt" selected>Português</option>
                            <option value="en">English</option>
                            <option value="es">Español</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label for="speedInput">Speed-up</label>
                        <select id="speedInput">
                            <option value="1.0">1.0×</option>
                            <option value="1.5">1.5×</option>
                            <option value="2.0">2.0×</option>
                            <option value="2.5" selected>2.5×</option>
                            <option value="3.0">3.0×</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label for="diarizeSelect">Falantes</label>
                        <select id="diarizeSelect">
                            <option value="false" selected>Não identificar</option>
                            <option value="true">Identificar (pyannote)</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- File Selected -->
            <section class="file-info hidden" id="fileInfo">
                <div class="file-card">
                    <div class="file-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="23 7 16 12 23 17 23 7"/>
                            <rect width="15" height="14" x="1" y="5" rx="2" ry="2"/>
                        </svg>
                    </div>
                    <div class="file-details">
                        <span class="file-name" id="fileName">—</span>
                        <span class="file-size" id="fileSize">—</span>
                    </div>
                    <button class="btn-icon" id="removeFileBtn" title="Remover arquivo">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                </div>
                <div class="option-group" style="margin-bottom: 16px;">
                    <label for="projectName">Nome da transcrição</label>
                    <input type="text" id="projectName" placeholder="ex: reuniao-sprint-15" class="text-input">
                </div>
                <button class="btn btn-primary btn-lg" id="transcribeBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    Transcrever
                </button>
            </section>

            <!-- Processing with live logs -->
            <section class="processing hidden" id="processingSection">
                <div class="processing-card">
                    <div class="processing-top">
                        <div class="spinner"></div>
                        <div>
                            <h3 id="processingTitle">Processando...</h3>
                            <p class="processing-hint" id="processingHint">Acompanhe o progresso abaixo</p>
                        </div>
                    </div>
                    <div class="progress-bar-track">
                        <div class="progress-bar-fill" id="progressBar"></div>
                    </div>
                    <span class="progress-label" id="progressLabel">0%</span>
                    <button class="btn btn-cancel" id="cancelBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        </svg>
                        Cancelar
                    </button>
                </div>
                <div class="log-panel">
                    <div class="log-header">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
                        </svg>
                        <span>Pipeline</span>
                    </div>
                    <div class="log-entries" id="logEntries"></div>
                </div>
            </section>

            <!-- Result -->
            <section class="result hidden" id="resultSection">
                <div class="result-header">
                    <h2>Transcrição completa</h2>
                    <div class="result-meta">
                        <span class="meta-chip" id="metaLang">—</span>
                        <span class="meta-chip" id="metaDuration">—</span>
                        <span class="meta-chip" id="metaTime">—</span>
                    </div>
                </div>
                <div class="result-text-wrapper">
                    <pre class="result-text" id="resultText"></pre>
                </div>
                <div class="result-actions">
                    <button class="btn btn-outline" id="copyBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                        </svg>
                        Copiar texto
                    </button>
                    <button class="btn btn-outline" id="newBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        Nova transcrição
                    </button>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
